<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divroom</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">Divroom <span class="sub">Pixoo 64 workbench</span></div>
  <div class="device" id="device">searching for device…</div>
</header>

<section class="controls">
  <h2>Control <span class="sub">local HTTP API · 127.0.0.1 only</span></h2>
  <div class="grid">
    <label>Color <input type="color" id="color" value="#ff0080"></label>
    <button data-act="color">Send color</button>

    <label>Color B <input type="color" id="color2" value="#00e0ff"></label>
    <button data-act="gradient">Send gradient</button>

    <label>Text <input type="text" id="text" placeholder="BRB" maxlength="64"></label>
    <button data-act="text">Send text</button>

    <label>Brightness <input type="range" id="bright" min="0" max="100" value="60"></label>
    <button data-act="brightness">Set</button>

    <label>Channel
      <select id="channel"><option>faces</option><option>cloud</option>
        <option>visualizer</option><option>custom</option></select></label>
    <button data-act="channel">Switch</button>

    <label>Screen
      <select id="screen"><option value="on">on</option><option value="off">off</option></select></label>
    <button data-act="screen">Apply</button>

    <label>Image/GIF <input type="file" id="image" accept="image/*"></label>
    <button data-act="image">Upload</button>

    <label>Animation
      <select id="anim"><option>rainbow</option><option>plasma</option>
        <option>sweep</option><option>pulse</option></select></label>
    <button data-act="animate">Play</button>

    <label>Speed (ms/frame) <input type="range" id="speed" min="20" max="300" value="100"></label>
    <span class="hint">uses Color + Color B for sweep/pulse</span>

    <label class="wide">16colo.rs art
      <span class="artrow">
        <input type="text" id="artpack" placeholder="pack e.g. fire-46">
        <input type="text" id="artfile" placeholder="file e.g. AK-KING.ANS">
      </span></label>
    <button data-act="art">Scroll art</button>
    <span class="hint">pans a 64×64 window down the piece · uses Speed</span>

    <label>Slideshow year <input type="number" id="year" value="2024" min="1990" max="2026"></label>
    <span class="artrow">
      <button id="startshow">Start</button>
      <button id="stopshow" disabled>Stop</button>
    </span>
    <span class="hint wide" id="showstat">random piece from that year, auto-advancing every 30s</span>

    <label class="wide">Raw command (JSON)
      <input type="text" id="raw" placeholder='{"Command":"Channel/GetAllConf"}'></label>
    <button data-act="raw">Send raw</button>
  </div>
  <div id="ctlout" class="ctlout"></div>
</section>

<script src="/static/app.js"></script>
</body>
</html>
